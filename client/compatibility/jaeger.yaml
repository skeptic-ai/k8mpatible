nodes:
  - name: jaeger
    docUrl: https://www.jaegertracing.io/docs/latest/operator/
    kubernetesResource:
      - name: jaeger
        namespace: observability
        type: deployment
        labels:
          app: jaeger
          app.kubernetes.io/name: jaeger
        image: jaegertracing/jaeger
edges:
  # Jaeger Operator / Jaeger compatibility with Kubernetes
  # Jaeger Operator supports N-2 Kubernetes versions
  # Jaeger v2 uses OpenTelemetry Operator for deployment
  # https://github.com/jaegertracing/jaeger-operator/blob/main/COMPATIBILITY.md
  - source: jaeger
    sourceVersion: 1.62
    destination: Kubernetes
    versionRange: ">=1.19, <=1.30"
    compatible: true
  - source: jaeger
    sourceVersion: 1.61
    destination: Kubernetes
    versionRange: ">=1.19, <=1.30"
    compatible: true
