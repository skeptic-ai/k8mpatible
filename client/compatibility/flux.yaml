# Researched 2026-10-20: latest stable Flux distribution v2.9.6.
# The former "supports all k8s versions" placeholder was not a support policy.
# https://fluxcd.io/flux/installation/#prerequisites (no docUrl existed before).
# Each range comes from that minor's official v2.<minor>.0 release notes:
# https://github.com/fluxcd/flux2/releases (Kubernetes compatibility section).
# Kubernetes 1.35: 2.8/2.9; 1.36: 2.9. Older minors do not document either.
# Flux distribution versions are NOT controller image versions (e.g. source-controller 1.x).
# No Kubernetes discovery resource is invented: this node is metadata-only, as
# the old placeholder had none. Automatic bundle-version discovery remains absent.
# Exact patch minima are retained; the checker evaluates the full destination
# semver so supported patches pass without accepting excluded .0 releases.
# 2.8 release table labels its first row v1.33 but says >=1.32.0;
# use the explicit v1.33 row label conservatively, not the conflicting minimum.
nodes:
  - name: flux
    docUrl: https://fluxcd.io/flux/installation/#prerequisites
    kubernetesResource: []
edges:
  - source: flux
    sourceVersion: "2.9"
    destination: Kubernetes
    versionRange: ">=1.34.1, <1.37"
    compatible: true
  - source: flux
    sourceVersion: "2.8"
    destination: Kubernetes
    versionRange: ">=1.33, <1.34 || >=1.34.1, <1.36"
    compatible: true
  - source: flux
    sourceVersion: "2.7"
    destination: Kubernetes
    versionRange: ">=1.32, <1.34 || >=1.34.1, <1.35"
    compatible: true
  - source: flux
    sourceVersion: "2.6"
    destination: Kubernetes
    versionRange: ">=1.31, <1.34"
    compatible: true
  - source: flux
    sourceVersion: "2.5"
    destination: Kubernetes
    versionRange: ">=1.30, <1.33"
    compatible: true
  - source: flux
    sourceVersion: "2.4"
    destination: Kubernetes
    versionRange: ">=1.29, <1.32"
    compatible: true
  - source: flux
    sourceVersion: "2.3"
    destination: Kubernetes
    versionRange: ">=1.28, <1.31"
    compatible: true
  - source: flux
    sourceVersion: "2.2"
    destination: Kubernetes
    versionRange: ">=1.26, <1.27 || >=1.27.1, <1.29"
    compatible: true
  - source: flux
    sourceVersion: "2.1"
    destination: Kubernetes
    versionRange: ">=1.25, <1.27 || >=1.27.1, <1.29"
    compatible: true
  - source: flux
    sourceVersion: "2.0"
    destination: Kubernetes
    versionRange: ">=1.24, <1.27 || >=1.27.1, <1.28"
    compatible: true
