nodes:
  - name: knative
    docUrl: https://knative.dev/docs/install/
    kubernetesResource:
      - name: activator
        namespace: knative-serving
        type: deployment
        labels:
          app: activator
          networking.knative.dev/ingress-provider: kourier
        image: activator
edges:
  # Knative Serving compatibility with Kubernetes — supports latest 3 minor K8s versions
  # https://knative.dev/docs/install/
  - source: knative
    sourceVersion: 1.22
    destination: Kubernetes
    versionRange: ">=1.33, <=1.35"
    compatible: true
  - source: knative
    sourceVersion: 1.21
    destination: Kubernetes
    versionRange: ">=1.32, <=1.34"
    compatible: true
  - source: knative
    sourceVersion: 1.20
    destination: Kubernetes
    versionRange: ">=1.31, <=1.33"
    compatible: true
  - source: knative
    sourceVersion: 1.19
    destination: Kubernetes
    versionRange: ">=1.30, <=1.32"
    compatible: true
  - source: knative
    sourceVersion: 1.18
    destination: Kubernetes
    versionRange: ">=1.29, <=1.31"
    compatible: true
  - source: knative
    sourceVersion: 1.17
    destination: Kubernetes
    versionRange: ">=1.28, <=1.30"
    compatible: true
  - source: knative
    sourceVersion: 1.16
    destination: Kubernetes
    versionRange: ">=1.27, <=1.29"
    compatible: true
