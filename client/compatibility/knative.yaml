nodes:
  - name: knative
    docUrl: https://github.com/knative/community/blob/main/mechanics/RELEASE-VERSIONING-PRINCIPLES.md
    kubernetesResource:
      - name: activator
        namespace: knative-serving
        type: deployment
        labels:
          app: activator
          networking.knative.dev/ingress-provider: kourier
        image: activator
edges:
  # Knative Serving compatibility with Kubernetes
  # Knative supports the range of upstream minor K8s versions that are
  # Kubernetes community supported at the time of the cut (latest ~4 minor versions).
  # https://github.com/knative/community/blob/main/mechanics/RELEASE-VERSIONING-PRINCIPLES.md
  # Version alignment derived from Knative release notes and operator version table.
  # Minimum K8s version for each release:
  #   Knative 1.22 -> min K8s 1.32 (supports 1.32–1.35)
  #   Knative 1.21 -> min K8s 1.31 (supports 1.31–1.34)
  #   Knative 1.20 -> min K8s 1.30 (supports 1.30–1.33)
  #   Knative 1.19 -> min K8s 1.29 (supports 1.29–1.32)
  #   Knative 1.18 -> min K8s 1.28 (supports 1.28–1.31)
  #   Knative 1.17 -> min K8s 1.27 (supports 1.27–1.30)
  #   Knative 1.16 -> min K8s 1.26 (supports 1.26–1.29)
  #   Knative 1.15 -> min K8s 1.25 (supports 1.25–1.28)
  #   Knative 1.14 -> min K8s 1.24 (supports 1.24–1.27)
  - source: knative
    sourceVersion: 1.22
    destination: Kubernetes
    versionRange: ">=1.32, <=1.35"
    compatible: true
  - source: knative
    sourceVersion: 1.21
    destination: Kubernetes
    versionRange: ">=1.31, <=1.34"
    compatible: true
  - source: knative
    sourceVersion: 1.20
    destination: Kubernetes
    versionRange: ">=1.30, <=1.33"
    compatible: true
  - source: knative
    sourceVersion: 1.19
    destination: Kubernetes
    versionRange: ">=1.29, <=1.32"
    compatible: true
  - source: knative
    sourceVersion: 1.18
    destination: Kubernetes
    versionRange: ">=1.28, <=1.31"
    compatible: true
  - source: knative
    sourceVersion: 1.17
    destination: Kubernetes
    versionRange: ">=1.27, <=1.30"
    compatible: true
  - source: knative
    sourceVersion: 1.16
    destination: Kubernetes
    versionRange: ">=1.26, <=1.29"
    compatible: true
  - source: knative
    sourceVersion: 1.15
    destination: Kubernetes
    versionRange: ">=1.25, <=1.28"
    compatible: true
  - source: knative
    sourceVersion: 1.14
    destination: Kubernetes
    versionRange: ">=1.24, <=1.27"
    compatible: true
