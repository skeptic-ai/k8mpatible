# Research: 2026-10-20. sourceVersion is VSO application/image version, NOT
# Vault server version. Removed nonexistent VSO 1.19/1.20/1.21; VSO released
# 0.1-0.10, then 1.0-1.6 (latest stable 1.6.1), per official releases.
# Docs: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso
# Releases: https://github.com/hashicorp/vault-secrets-operator/releases/tag/v1.6.1
# Each edge uses the named release tag's integration-test matrix (not a minimum
# Kubernetes requirement and not proof every earlier patch was tested).
# Matrix root: https://github.com/hashicorp/vault-secrets-operator/tree/v1.6.1/.github/workflows
# 1.35: present in VSO 1.2-1.6 matrices. 1.36: present from 1.4.1, also 1.5/1.6.
# Earlier VSO minors have no 1.35/1.36 evidence here; leave unknown, not false.
# Current docs list 1.32-1.36 globally (worded as tests of Vault), without a
# historical VSO-version mapping. Latest VSO 1.6 CI starts at 1.33: 1.32 is a
# docs/CI coverage discrepancy, not a proven incompatibility; no test is invented.
# v1.6.1 CI additionally configures 1.37, absent from that documented support
# list; this edge conservatively includes only its documented 1.33-1.36 overlap.
# <next minor upper bounds include Kubernetes patches, not only x.y.0.
nodes:
  - name: vault-secrets-operator
    docUrl: https://developer.hashicorp.com/vault/docs/deploy/kubernetes/vso
    kubernetesResource:
      - name: vault-secrets-operator
        namespace: vault-secrets-operator
        type: deployment
        labels:
          app.kubernetes.io/name: vault-secrets-operator
        image: vault-secrets-operator

edges:
