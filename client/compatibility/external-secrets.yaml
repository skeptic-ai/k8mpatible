# Research: 2026-10-20. Application/image minors, not Helm chart versions.
# Source: https://external-secrets.io/main/introduction/stability-support/
# Releases: https://github.com/external-secrets/external-secrets/releases/tag/v2.13.0
# These are upstream TEST-COVERAGE ranges, not exclusive runtime requirements.
# Removed false !=version incompatibilities: untested does not mean incompatible.
# 1.35 is documented for ESO 2.0-2.8; 1.36 for 2.8-2.13. For other minors these
# Kubernetes versions are undocumented, not explicitly incompatible.
# Bounds use <next minor to include patch releases. Only the current ESO minor
# receives upstream maintenance; historical tested ranges do not imply maintenance.
nodes:
