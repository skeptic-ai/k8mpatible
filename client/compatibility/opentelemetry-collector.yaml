nodes:
  - name: opentelemetry-collector
    docUrl: https://github.com/open-telemetry/opentelemetry-operator/blob/main/docs/compatibility.md
    kubernetesResource:
      - name: opentelemetry-collector
        namespace: opentelemetry
        type: deployment
        labels:
          app.kubernetes.io/name: opentelemetry-collector
        image: otel/opentelemetry-collector-contrib
edges:
  # OpenTelemetry Operator / Collector compatibility with Kubernetes
  # Operator v0.151+ tracks Collector v0.151.x, supports K8s v1.25–v1.35
  # https://github.com/open-telemetry/opentelemetry-operator/blob/main/docs/compatibility.md
  - source: opentelemetry-collector
    sourceVersion: 0.151
    destination: Kubernetes
    versionRange: ">=1.25, <=1.35"
    compatible: true
