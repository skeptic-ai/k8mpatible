# Reviewed 2026-10-20 against the released OpenTelemetry Operator v0.161.0.
# Source: https://github.com/open-telemetry/opentelemetry-operator/blob/v0.161.0/docs/getting-started/compatibility.md
# Historical rows 0.122-0.129: https://github.com/open-telemetry/opentelemetry-operator/blob/v0.151.0/docs/compatibility.md
# Release: https://github.com/open-telemetry/opentelemetry-operator/releases/tag/v0.161.0
# Discovery: https://github.com/open-telemetry/opentelemetry-operator/releases/download/v0.161.0/opentelemetry-operator.yaml
# Preserve Collector runtime discovery separately; Operator compatibility belongs
# only to the distinct opentelemetry-operator node, not arbitrary Collector images.
# Collector contrib latest: v0.163.0. Its Kubernetes 1.35/1.36 matrix is unknown.
# https://opentelemetry.io/docs/collector/
# Kubernetes 1.35: explicitly supported by Operator 0.142-0.161.
# Kubernetes 1.36: explicitly supported by Operator 0.157-0.161 only.
# 0.160-0.161 explicitly include 1.37; do not extend earlier rows to 1.36.
# Gaps 0.128/0.130/0.133 have no released Operator minor; 0.133 is N/A in matrix.
# Prometheus-Operator column is a bundled Go/CRD package version, NOT a
# minimum installed operator dependency; the former >= dependency edges were false.
nodes:
  - name: opentelemetry-collector
    docUrl: https://opentelemetry.io/docs/collector/
    kubernetesResource:
      - name: opentelemetry-collector
        namespace: opentelemetry
        type: deployment
        labels:
          app.kubernetes.io/name: opentelemetry-collector
        image: otel/opentelemetry-collector-contrib
  - name: opentelemetry-operator
    docUrl: https://github.com/open-telemetry/opentelemetry-operator/blob/main/docs/getting-started/compatibility.md
    kubernetesResource:
      - name: opentelemetry-operator-controller-manager
        namespace: opentelemetry-operator-system
        type: deployment
        labels:
          app.kubernetes.io/name: opentelemetry-operator
        image: open-telemetry/opentelemetry-operator/opentelemetry-operator
