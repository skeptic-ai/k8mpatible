nodes:
  - name: sealed-secrets
    docUrl: https://github.com/bitnami-labs/sealed-secrets
    kubernetesResource:
      - name: sealed-secrets-controller
        namespace: kube-system
        type: deployment
        labels:
          app.kubernetes.io/name: sealed-secrets
          app.kubernetes.io/component: controller
        image: sealed-secrets-controller
edges:
  # Sealed Secrets compatibility with Kubernetes
  # Supports K8s 1.16+, aligns with currently supported K8s versions
  # https://github.com/bitnami-labs/sealed-secrets
  - source: sealed-secrets
    sourceVersion: 1.0
    destination: Kubernetes
    versionRange: ">=1.31, <=1.35"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.27
    destination: Kubernetes
    versionRange: ">=1.30, <=1.34"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.26
    destination: Kubernetes
    versionRange: ">=1.29, <=1.33"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.25
    destination: Kubernetes
    versionRange: ">=1.28, <=1.32"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.24
    destination: Kubernetes
    versionRange: ">=1.27, <=1.31"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.23
    destination: Kubernetes
    versionRange: ">=1.26, <=1.30"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.22
