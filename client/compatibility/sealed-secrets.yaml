nodes:
  - name: sealed-secrets
    docUrl: https://artifacthub.io/packages/helm/bitnami/sealed-secrets
    kubernetesResource:
      - name: sealed-secrets-controller
        namespace: kube-system
        type: deployment
        labels:
          app.kubernetes.io/name: sealed-secrets
          app.kubernetes.io/component: controller
        image: sealed-secrets-controller
edges:
  # Sealed Secrets compatibility with Kubernetes
  # The controller relies on stable Kubernetes APIs and supports K8s 1.16+.
  # Version ranges reflect the K8s versions that were current/supported at the
  # time of each sealed-secrets release.
  # Source: https://artifacthub.io/packages/helm/bitnami/sealed-secrets
  # ("Kubernetes: >=1.16.0-0")
  # https://github.com/bitnami-labs/sealed-secrets#readme (stable API
  # compatibility, no hard per-version matrix published — ranges based on
  # K8s community support window at time of release).
  - source: sealed-secrets
    sourceVersion: 1.0
    destination: Kubernetes
    versionRange: ">=1.31, <=1.35"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.27
    destination: Kubernetes
    versionRange: ">=1.30, <=1.34"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.26
    destination: Kubernetes
    versionRange: ">=1.29, <=1.33"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.25
    destination: Kubernetes
    versionRange: ">=1.28, <=1.32"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.24
    destination: Kubernetes
    versionRange: ">=1.27, <=1.31"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.23
    destination: Kubernetes
    versionRange: ">=1.26, <=1.30"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.22
    destination: Kubernetes
    versionRange: ">=1.25, <=1.29"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.21
    destination: Kubernetes
    versionRange: ">=1.24, <=1.28"
    compatible: true
  - source: sealed-secrets
    sourceVersion: 0.20
    destination: Kubernetes
    versionRange: ">=1.23, <=1.27"
    compatible: true
