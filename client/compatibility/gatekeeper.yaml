# Research refreshed 2026-10-20; latest release: v3.23.1.
# https://github.com/open-policy-agent/gatekeeper/releases/tag/v3.23.1
# Checked docUrl: Kubernetes 1.16 is an API-resource floor, NOT a tested matrix.
# Historical positive ranges below use the Kubernetes minors configured in
# each v3.<minor>.0 tag's .github/workflows/workflow.yaml, not an invented N-2
# sliding range. These are upstream CI targets, not successful test results.
# https://github.com/open-policy-agent/gatekeeper/blob/v3.23.1/.github/workflows/workflow.yaml
# https://github.com/open-policy-agent/gatekeeper/blob/v3.13.0/.github/workflows/workflow.yaml
# Supported Gatekeeper branches are current and previous (3.23 and 3.22).
# Upstream ASSUMES those branches work with currently supported Kubernetes.
# https://github.com/open-policy-agent/gatekeeper/blob/v3.23.1/docs/Release_Management.md#supported-kubernetes-versions
# Active Kubernetes branches include 1.34 in maintenance until 2026-10-27,
# as well as 1.35-1.37; the policy links active branches, not only the newest three.
# https://kubernetes.io/releases/patch-releases/#detailed-release-history-for-active-branches
# Kubernetes 1.34-1.37: covered for 3.22/3.23 by that support-policy
# assumption, NOT their pinned CI matrix (1.31.6, 1.32.3, 1.33.2).
# Earlier Gatekeeper minors: no 1.35/1.36 evidence found; no negative edges.
nodes:
  - name: gatekeeper
    docUrl: https://open-policy-agent.github.io/gatekeeper/website/docs/install/
    kubernetesResource:
      - name: gatekeeper-controller-manager
        namespace: gatekeeper-system
        type: deployment
        labels:
          app: gatekeeper
          app.kubernetes.io/name: gatekeeper
        image: openpolicyagent/gatekeeper
edges:
