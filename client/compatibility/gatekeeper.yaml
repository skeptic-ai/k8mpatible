nodes:
  - name: gatekeeper
    docUrl: https://open-policy-agent.github.io/gatekeeper/website/docs/install/
    kubernetesResource:
      - name: gatekeeper-controller-manager
        namespace: gatekeeper-system
        type: deployment
        labels:
          app: gatekeeper
          app.kubernetes.io/name: gatekeeper
        image: openpolicyagent/gatekeeper
edges:
  # OPA Gatekeeper compatibility with Kubernetes
  # Gatekeeper supports all currently supported Kubernetes versions (N-2 policy)
  # https://open-policy-agent.github.io/gatekeeper/website/docs/install/
  # https://endoflife.date/gatekeeper
  - source: gatekeeper
    sourceVersion: 3.22
    destination: Kubernetes
    versionRange: ">=1.30, <=1.35"
    compatible: true
  - source: gatekeeper
    sourceVersion: 3.21
    destination: Kubernetes
    versionRange: ">=1.29, <=1.35"
    compatible: true
  - source: gatekeeper
    sourceVersion: 3.20
    destination: Kubernetes
    versionRange: ">=1.28, <=1.34"
    compatible: true
  - source: gatekeeper
    sourceVersion: 3.19
    destination: Kubernetes
    versionRange: ">=1.27, <=1.33"
    compatible: true
  - source: gatekeeper
    sourceVersion: 3.18
    destination: Kubernetes
    versionRange: ">=1.26, <=1.32"
    compatible: true
  - source: gatekeeper
    sourceVersion: 3.17
    destination: Kubernetes
    versionRange: ">=1.25, <=1.31"
    compatible: true
  - source: gatekeeper
    sourceVersion: 3.16
    destination: Kubernetes
    versionRange: ">=1.24, <=1.30"
    compatible: true
  - source: gatekeeper
