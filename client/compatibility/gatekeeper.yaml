    sourceVersion: "3.23"
    destination: Kubernetes
    versionRange: ">=1.31, <1.38"
    compatible: true
    reason: "Upstream CI targets 1.31-1.33; 1.34-1.37 are a current support-policy assumption, not tested versions."
