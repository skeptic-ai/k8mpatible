# Research refreshed 2026-10-20; latest Agent / Cluster Agent: 7.84.4.
# https://github.com/DataDog/datadog-agent/releases/tag/7.84.4
# Both original docUrls were checked. The installation table specifies MINIMUM
# AGENT versions for Kubernetes feature/API changes, NOT tested server ranges
# or a minimum Kubernetes version required by each Agent release.
# https://docs.datadoghq.com/containers/kubernetes/installation/#minimum-kubernetes-and-datadog-agent-versions
# This file models the table's Kubernetes 1.16+ scope; 1.16 is not claimed to
# be the absolute server minimum. Inverting its thresholds caps Agent 7.19-
# 7.35 below 1.21, 7.36 below 1.22, 7.37-7.39 below 1.25, 7.40-7.66 below
# 1.33. Newer Agents are not restricted to only the newest Kubernetes minor.
# Agent 7.19-7.84 releases were verified; Cluster Agent 7.39-7.84 image tags
# were checked separately. Docs mention Cluster Agent 7.37+, but Docker Hub
# has no 7.37/7.38 tags: do not invent versions for the discovered image.
# https://hub.docker.com/v2/repositories/datadog/cluster-agent/tags?page_size=100&name=7.37.
# https://hub.docker.com/v2/repositories/datadog/cluster-agent/tags?page_size=100&name=7.38.
# https://hub.docker.com/v2/repositories/datadog/cluster-agent/tags/7.84.4
# Kubernetes 1.35 / 1.36 satisfy the documented 1.33+ => Agent/Cluster Agent
# 7.67+ minimum-only policy. This is NOT evidence of per-release testing on
# those minors; no artificial maximum is added to that open-ended policy.
# https://docs.datadoghq.com/containers/cluster_agent/#minimum-agent-and-cluster-agent-versions
# Matching Agent/Cluster Agent versions are recommended, not a hard dependency.
nodes:
  - name: datadog-agent
    docUrl: https://docs.datadoghq.com/containers/kubernetes/installation/#minimum-kubernetes-and-datadog-agent-versions
    kubernetesResource:
      - name: datadog-agent
        namespace: datadog
        type: daemonset
        labels:
          app.kubernetes.io/name: datadog-agent
        image: datadog/agent
  - name: datadog-cluster-agent
    docUrl: https://docs.datadoghq.com/containers/kubernetes/installation/?tab=datadogoperator#minimum-kubernetes-and-datadog-agent-versions
    kubernetesResource:
      - name: datadog-cluster-agent
        namespace: datadog
        type: deployment
        labels:
          app.kubernetes.io/name: datadog-cluster-agent
        image: datadog/cluster-agent


