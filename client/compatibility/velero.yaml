# Reviewed 2026-10-20; latest stable release is v1.18.4 (no released 1.19 minor).
# Sources: https://github.com/velero-io/velero#velero-compatibility-matrix
# https://github.com/velero-io/velero/releases/tag/v1.18.4
# Historical tests: https://github.com/velero-io/velero/blob/v1.13.0/README.md#velero-compatibility-matrix
# 1.9/1.10 tests also verified at their own v1.9.0/v1.10.0 README tags.
# The former docUrl /docs/v1.16/compatibility/ is a 404.
# These edges deliberately encode TESTED MINOR ENVELOPES, not minimum support.
# Upstream expects 1.18-latest for 1.11-1.18 (older release docs differ), and
# recommends testing combinations outside the listed coverage. Do not infer a
# finite support maximum or future-version validation from the word "latest".
# Kubernetes 1.35: tested at 1.35.0 with Velero 1.18; retained as <1.36.0.
# Kubernetes 1.36: no explicit tested row in current official matrix; not added.
# Older rows are retained, not retroactively extended to 1.35/1.36.
# Patch-specific test results are projected to minors, as required by this graph.
nodes:
  - name: velero
    docUrl: https://github.com/velero-io/velero#velero-compatibility-matrix
    kubernetesResource:
      - name: velero
        namespace: velero
        type: deployment
        labels:
          app.kubernetes.io/name: velero
        image: velero/velero
edges:
  # Velero 1.18 tested: 1.33.7, 1.34.1, and 1.35.0
  - source: velero
    sourceVersion: "1.18"
    destination: Kubernetes
    versionRange: ">=1.33.0, <1.36.0"
    compatible: true
  # Velero 1.17 tested: 1.31.7, 1.32.3, 1.33.1, and 1.34.0
  - source: velero
    sourceVersion: "1.17"
    destination: Kubernetes
    versionRange: ">=1.31.0, <1.35.0"
    compatible: true
  # Velero 1.16 tested: 1.31.4, 1.32.3, and 1.33.0
  - source: velero
    sourceVersion: "1.16"
    destination: Kubernetes
    versionRange: ">=1.31.0, <1.34.0"
    compatible: true
  # Velero 1.15 tested: 1.28.8, 1.29.8, 1.30.4 and 1.31.1
  - source: velero
    sourceVersion: "1.15"
    destination: Kubernetes
    versionRange: ">=1.28.0, <1.32.0"
    compatible: true
  # Velero 1.14 tested: 1.27.9, 1.28.9, and 1.29.4
  - source: velero
    sourceVersion: "1.14"
    destination: Kubernetes
    versionRange: ">=1.27.0, <1.30.0"
    compatible: true
  # Velero 1.13 tested: 1.26.5, 1.27.3, 1.27.8, and 1.28.3
  - source: velero
    sourceVersion: "1.13"
    destination: Kubernetes
    versionRange: ">=1.26.0, <1.29.0"
    compatible: true
  # Velero 1.12 tested: 1.25.7, 1.26.5, 1.26.7, and 1.27.3
  - source: velero
    sourceVersion: "1.12"
    destination: Kubernetes
    versionRange: ">=1.25.0, <1.28.0"
    compatible: true
  # Velero 1.11 tested: 1.23.10, 1.24.9, 1.25.5, and 1.26.1
  - source: velero
    sourceVersion: "1.11"
    destination: Kubernetes
    versionRange: ">=1.23.0, <1.27.0"
    compatible: true
  # Velero 1.10 tested: 1.22.5, 1.23.8, 1.24.6 and 1.25.1
  - source: velero
    sourceVersion: "1.10"
    destination: Kubernetes
    versionRange: ">=1.22.0, <1.26.0"
    compatible: true
  # Velero 1.9 tested: 1.20.5, 1.21.2, 1.22.5, 1.23, and 1.24
  - source: velero
    sourceVersion: "1.9"
    destination: Kubernetes
    versionRange: ">=1.20.0, <1.25.0"
    compatible: true
