nodes:
  - name: velero
    docUrl: https://velero.io/docs/v1.16/compatibility/
    kubernetesResource:
      - name: velero
        namespace: velero
        type: deployment
        labels:
          app.kubernetes.io/name: velero
        image: velero/velero
edges:
  # Velero compatibility with Kubernetes
  # https://velero.io/docs/ (see compatibility section)
  # https://github.com/vmware-tanzu/velero#compatibility-matrix
  #
  # Velero version | Expected Kubernetes compatibility | Tested on K8s
  # 1.18           | 1.18-latest                      | 1.33.7, 1.34.1, 1.35.0
  # 1.17           | 1.18-latest                      | 1.31.7, 1.32.3, 1.33.1, 1.34.0
  # 1.16           | 1.18-latest                      | 1.31.4, 1.32.3, 1.33.0
  # 1.15           | 1.18-latest                      | 1.28.8, 1.29.8, 1.30.4, 1.31.1
  # 1.14           | 1.18-latest                      | 1.27.9, 1.28.9, 1.29.4
  - source: velero
    sourceVersion: 1.18
    destination: Kubernetes
    versionRange: ">=1.33, <=1.35"
    compatible: true
  - source: velero
    sourceVersion: 1.17
    destination: Kubernetes
    versionRange: ">=1.31, <=1.34"
    compatible: true
  - source: velero
    sourceVersion: 1.16
    destination: Kubernetes
    versionRange: ">=1.31, <=1.33"
    compatible: true
  - source: velero
    sourceVersion: 1.15
    destination: Kubernetes
    versionRange: ">=1.28, <=1.31"
    compatible: true
  - source: velero
    sourceVersion: 1.14
    destination: Kubernetes
    versionRange: ">=1.27, <=1.29"
    compatible: true
  - source: velero
    sourceVersion: 1.13
    destination: Kubernetes
    versionRange: ">=1.26, <=1.28"
    compatible: true
  - source: velero
    sourceVersion: 1.12
    destination: Kubernetes
    versionRange: ">=1.25, <=1.27"
    compatible: true
  - source: velero
    sourceVersion: 1.11
    destination: Kubernetes
    versionRange: ">=1.24, <=1.26"
    compatible: true
  - source: velero
    sourceVersion: 1.10
    destination: Kubernetes
    versionRange: ">=1.23, <=1.25"
    compatible: true
  - source: velero
    sourceVersion: 1.9
    destination: Kubernetes
    versionRange: ">=1.22, <=1.24"
    compatible: true
