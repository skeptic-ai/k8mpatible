# Reviewed 2026-10-20; latest released Prometheus Operator is v0.94.1.
# Sources: https://prometheus-operator.dev/docs/getting-started/compatibility/
# https://github.com/prometheus-operator/prometheus-operator/releases/tag/v0.94.1
# CI ceilings: https://github.com/prometheus-operator/prometheus-operator/blob/v0.94.0/.github/env
# Each historical ceiling uses the same .github/env path at its v0.<minor>.0 tag.
# CI setup consumes kind-image: https://github.com/prometheus-operator/prometheus-operator/blob/v0.94.1/.github/actions/setup-e2e/action.yaml
# Minimum is 1.25 for >=0.84 (CEL), 1.16 before 0.84: client-go is NOT the minimum.
# 1.23 with CustomResourceValidationExpressions enabled is conditional and not encoded.
# Ranges combine the documented minimum with the release's configured CI ceiling;
# the upper bound is an evidence horizon, NOT an upstream incompatibility claim.
# Kubernetes 1.35: release CI explicitly uses 1.35.1 for 0.90/0.91.
# Kubernetes 1.36: release CI explicitly uses 1.36.1 for 0.92/0.93.
# 0.94 CI uses 1.37.0; documented minimum still covers 1.35/1.36 (not separately CI-tested).
# No extension of older releases to 1.35/1.36 based only on client-go skew.
nodes:
  - name: prometheus-operator
    docUrl: https://prometheus-operator.dev/docs/getting-started/compatibility/
    kubernetesResource:
      - name: prometheus-operator
        namespace: monitoring
        type: deployment
        labels:
          app.kubernetes.io/name: prometheus-operator
        image: prometheus-operator
edges:
