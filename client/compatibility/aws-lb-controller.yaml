# Research: 2026-10-20. Application/image minors, not Helm chart versions.
# Source: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/deploy/installation/#supported-kubernetes-versions
# Releases: https://github.com/kubernetes-sigs/aws-load-balancer-controller/releases/tag/v3.6.0
# v2.0-v2.3 have documented 1.21 ceilings; <1.22 includes 1.21 patch releases.
# v2.4 requires 1.19+; v2.5+ requires 1.22+. Open ranges encode minimum-only
# upstream policy, NOT a tested-version matrix. Kubernetes 1.35 and 1.36 meet
# that policy, but version-specific testing is undocumented in these sources.
# Feature caveat: v2.4.7 EndpointSlice support specifically requires 1.21+.
nodes:
  - name: aws-load-balancer-controller
    docUrl: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/deploy/installation/#supported-kubernetes-versions
    kubernetesResource:
      - name: aws-load-balancer-controller
        namespace: kube-system
        type: deployment
        labels:
          app.kubernetes.io/name: aws-load-balancer-controller
        image: aws-load-balancer-controller
