# Research: 2026-10-20. Application/image minors, not Helm chart versions.
# Source: https://github.com/kubernetes-sigs/external-dns#kubernetes-version-compatibility
# Releases: https://github.com/kubernetes-sigs/external-dns/releases/tag/v0.23.0
# The official matrix explicitly accepts Kubernetes >=1.33 for ExternalDNS
# >=0.18.x, so 1.35/1.36 are included by upstream compatibility policy, not
# individually confirmed tests. >=0.18 also supports 1.21-1.32 (old floor fixed).
# The same matrix rejects >=1.33 for 0.10-0.17: their old open ranges were false.
# Only explicit matrix rejections are encoded as incompatible; <next minor
# bounds include all patches of the last compatible/incompatible Kubernetes minor.
nodes:
  - name: external-dns
    docUrl: https://github.com/kubernetes-sigs/external-dns
    kubernetesResource:
      - name: external-dns
        namespace: external-dns
        type: deployment
        labels:
          app.kubernetes.io/name: external-dns
        image: external-dns

edges:
