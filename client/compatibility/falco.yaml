nodes:
  - name: falco
    docUrl: https://falco.org/docs/setup/operator/#prerequisites
    kubernetesResource:
      - name: falco
        namespace: falco
        type: daemonset
        labels:
          app.kubernetes.io/name: falco
        image: falcosecurity/falco
edges:
  # Falco compatibility with Kubernetes
  # The Falco operator requires Kubernetes 1.29+ as a prerequisite.
  # https://falco.org/docs/setup/operator/#prerequisites
  # Falco versions prior to the operator-based deployment (pre-0.40) supported
  # older K8s versions via manual DaemonSet deployment, but the recommended
  # operator-based installation requires K8s 1.29+.
  - source: falco
    sourceVersion: 0.43
    destination: Kubernetes
    versionRange: ">=1.29, <=1.35"
    compatible: true
  - source: falco
    sourceVersion: 0.42
    destination: Kubernetes
    versionRange: ">=1.29, <=1.35"
    compatible: true
  - source: falco
    sourceVersion: 0.41
    destination: Kubernetes
    versionRange: ">=1.29, <=1.34"
    compatible: true
  - source: falco
    sourceVersion: 0.40
    destination: Kubernetes
    versionRange: ">=1.29, <=1.34"
    compatible: true
  - source: falco
    sourceVersion: 0.39
    destination: Kubernetes
    versionRange: ">=1.29, <=1.33"
    compatible: true
  - source: falco
    sourceVersion: 0.38
    destination: Kubernetes
    versionRange: ">=1.29, <=1.33"
    compatible: true
  - source: falco
    sourceVersion: 0.37
    destination: Kubernetes
    versionRange: ">=1.29, <=1.32"
    compatible: true
  - source: falco
    sourceVersion: 0.36
    destination: Kubernetes
    versionRange: ">=1.29, <=1.32"
    compatible: true
  - source: falco
    sourceVersion: 0.35
    destination: Kubernetes
    versionRange: ">=1.29, <=1.31"
    compatible: true
  - source: falco
    sourceVersion: 0.34
    destination: Kubernetes
    versionRange: ">=1.29, <=1.30"
    compatible: true
