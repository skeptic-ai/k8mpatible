nodes:
  - name: traefik
    docUrl: https://doc.traefik.io/traefik/deprecation/releases/
    kubernetesResource:
      - name: traefik
        namespace: traefik
        type: deployment
        labels:
          app.kubernetes.io/name: traefik
        image: traefik
edges:
  # Traefik Proxy compatibility with Kubernetes
  # Traefik follows Kubernetes support policy — latest 3 minor versions
  # https://community.traefik.io/t/traefik-support-configuration/19060
  - source: traefik
    sourceVersion: 3.6
    destination: Kubernetes
    versionRange: ">=1.33, <=1.35"
    compatible: true
  - source: traefik
    sourceVersion: 3.5
    destination: Kubernetes
    versionRange: ">=1.32, <=1.34"
    compatible: true
  - source: traefik
    sourceVersion: 3.4
    destination: Kubernetes
    versionRange: ">=1.31, <=1.33"
    compatible: true
  - source: traefik
    sourceVersion: 3.3
    destination: Kubernetes
    versionRange: ">=1.30, <=1.32"
    compatible: true
  - source: traefik
    sourceVersion: 3.2
    destination: Kubernetes
    versionRange: ">=1.29, <=1.31"
    compatible: true
  - source: traefik
    sourceVersion: 3.1
    destination: Kubernetes
    versionRange: ">=1.28, <=1.30"
    compatible: true
  - source: traefik
    sourceVersion: 3.0
    destination: Kubernetes
    versionRange: ">=1.27, <=1.29"
    compatible: true
  - source: traefik
    sourceVersion: 2.11
    destination: Kubernetes
    versionRange: ">=1.26, <=1.28"
    compatible: true
